name: ci
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests scripts
      # includes the calibration regression gate (tests/unit/test_calibration_gate.py):
      # a prompt change without a fresh scripts/calibrate.py run fails the build
      - run: uv run pytest -v

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test            # Talk mode: VAD, TTS chunking, state machine, cleanup, races
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t banana-english-api .
      - run: docker build -t banana-english-web frontend
