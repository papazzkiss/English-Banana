# Drop-in for the user unit ollama.service (~/.config/systemd/user/ollama.service.d/banana.conf).
# Install: ollama/systemd/install.sh. Why: OOM_AUDIT.md.
[Service]
# Soft memory limit. In GPU mode Ollama's memory is almost all page cache of the memory-mapped
# expert weights (clean, re-read from disk when needed). Above this, the kernel drops that cache
# instead of pushing the desktop's and the containers' memory to swap (measured: loading the
# model without it filled the 4 GiB swap). It never kills Ollama. Measured with thinking: 7G
# 6.5-7.6 tokens/s, 8G 8.4-8.8, 9G 10.5-10.7 (as fast as without a limit).
MemoryHigh=9G
# One model in memory at a time: a second one does not fit next to Qwen3-30B-A3B.
Environment=OLLAMA_MAX_LOADED_MODELS=1
# Wake the discrete GPU before Ollama probes it, and refuse to run without it.
ExecStartPre=%h/.local/ollama/bin/banana-ollama-gpu-wake.sh
ExecStartPost=%h/.local/ollama/bin/banana-ollama-gpu-check.sh
