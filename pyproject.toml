[project]
name = "banana-english"
version = "0.1.0"
description = "Banana English — AI-powered adaptive English learning platform (Phase 0 foundation)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "redis>=5.2",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]
content = [
    "wn>=0.11",
    "piper-tts>=1.2",
    "spacy>=3.8",
    "wordfreq>=3.1",
    "lemminflect>=0.2.3",
    "pyarrow>=17",
    "en-core-web-sm",
]
speech = [
    "faster-whisper>=1.1",
    "piper-tts>=1.2",  # AI Monkey's voice
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banana_english"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real model (Ollama / Whisper); run with BANANA_LIVE=1"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# stdlib-only operator smoke script: compact, print-oriented
"scripts/smoke_live.py" = ["E501", "E701", "E702", "SIM115"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
