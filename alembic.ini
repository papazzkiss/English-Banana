[alembic]
script_location = src/banana_english/infrastructure/database/migrations
# Overridden by BANANA_DATABASE_URL (see migrations/env.py callers); default for local CLI use:
sqlalchemy.url = sqlite:///banana_english.db

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
